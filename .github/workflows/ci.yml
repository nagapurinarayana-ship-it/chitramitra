name: ChitraMitra Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chitramitra-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PUBLIC_BASE_URL: https://chitramitra.pages.dev

jobs:
  build-quality-e2e:
    name: Build, Quality Gate & Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production site
        run: npm run build
      - name: Verify frozen content matrix
        run: npm run verify
      - name: Run production quality gate
        run: npm run qa
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
        env:
          CI: true
      - name: Validate generated artifact
        run: |
          test -f index.html
          test -f sitemap.xml
          test -f robots.txt
          test -d resources
          test -d learn
          test -f health.txt
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chitramitra-playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: chitramitra-test-diagnostics-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  production-gate:
    name: Production Gate
    needs: build-quality-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for Cloudflare production deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -e
          for attempt in {1..120}; do
            body="$(curl -fsS --max-time 10 https://chitramitra.pages.dev/health.txt || true)"
            echo "$body"
            if echo "$body" | grep -q "chitramitra-build=$EXPECTED_SHA"; then
              echo "Production is serving the expected commit: $EXPECTED_SHA"
              exit 0
            fi
            echo "Waiting for production deployment (attempt $attempt/120)..."
            sleep 10
          done
          echo "Production did not serve the expected commit within 20 minutes."
          exit 1

      - name: Production smoke checks
        run: |
          set -e
          for url in             "https://chitramitra.pages.dev/"             "https://chitramitra.pages.dev/resources/en/numbers/worksheet.html"             "https://chitramitra.pages.dev/learn/en/numbers/1-one/"             "https://chitramitra.pages.dev/learn/te/alphabet/item-01/"             "https://chitramitra.pages.dev/sitemap.xml"             "https://chitramitra.pages.dev/robots.txt"             "https://chitramitra.pages.dev/styles.css"             "https://chitramitra.pages.dev/learn.css"             "https://chitramitra.pages.dev/resource.css"; do
            echo "Checking $url"
            curl -fsSL --max-time 20 "$url" >/dev/null
          done
          echo "Production smoke checks passed."

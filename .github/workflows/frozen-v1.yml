name: ChitraMitra — Full Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: write

concurrency:
  group: chitramitra-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, verify, audit UI and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install test tooling
        run: npm install --no-audit --no-fund

      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium

      - name: Generate the complete site
        run: npm run build

      - name: Verify frozen content matrix
        run: npm run verify

      - name: Run deterministic quality gate
        run: npm run qa

      - name: Run browser UI tests
        run: npx playwright test --project=chromium --project=mobile

      - name: Accessibility and safety baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f robots.txt
          test -f sitemap.xml
          grep -q 'lang="en"' index.html
          grep -q 'aria-label="Search resources"' index.html
          ! grep -RniE 'child.*(photo|date of birth)|password|credit card' index.html app.js data.js resources/index.html

      - name: Upload browser evidence on failure
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: chitramitra-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish generated resources
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --cached --quiet; then
            echo 'No generated changes to publish.'
            exit 0
          fi
          git commit -m 'chore: build ChitraMitra resources [auto]'
          for attempt in $(seq 1 10); do
            if git push origin HEAD:main; then
              echo "Published successfully on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing onto latest main."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo 'Unable to publish after 10 attempts.'
          exit 1
